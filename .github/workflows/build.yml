name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build MunicipalServicesApp.sln --configuration Release

      - name: Test
        run: dotnet test MunicipalServicesApp.Tests --configuration Release --no-build
